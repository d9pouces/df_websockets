[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
authors = [{name = "Matthieu Gallet", email = "github@19pouces.net"}]
classifiers = [
  'Development Status :: 5 - Production/Stable',
  'Framework :: Django :: 3.1',
  'Framework :: Django :: 3.2',
  'Framework :: Django :: 4.0',
  'Framework :: Django :: 4.1',
  'Framework :: Django :: 4.2',
  'Framework :: Django :: 5.0',
  'Framework :: Django :: 5.1',
  'Framework :: Django :: 5.2',
  'License :: OSI Approved :: CEA CNRS Inria Logiciel Libre License, version 2.1 (CeCILL-2.1)',
  'Operating System :: MacOS :: MacOS X',
  'Operating System :: Microsoft :: Windows',
  'Operating System :: POSIX :: BSD',
  'Operating System :: POSIX :: Linux',
  'Operating System :: Unix',
  'Programming Language :: Python :: 3 :: Only',
  'Programming Language :: Python :: 3.10',
  'Programming Language :: Python :: 3.11',
  'Programming Language :: Python :: 3.12',
  'Programming Language :: Python :: 3.13',
  'Programming Language :: Python :: 3.14'
]
dependencies = [
  "channels-redis>=4.2.1,<5",
  "django>=2.2"
]
description = "Websocket integration for Django"
license = "CECILL-B"
maintainers = [{name = "Matthieu Gallet", email = "github@19pouces.net"}]
name = "df_websockets"
readme = "README.md"
requires-python = ">=3.9"
version = "1.2.6"

[project.urls]
Documentation = 'https://github.com/d9pouces/df_websockets'
Repository = 'https://github.com/d9pouces/df_websockets'

[dependency-groups]
dev = [
  "celery>=5.4.0,<6",
  "coverage>=7.6.4,<8",
  "daphne>=4.1.2,<5",
  "pytest-django>=4.9.0,<5",
  "tox>=4.4.12"
]

[tool.hatch.build.targets.wheel]
packages = ["df_websockets"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "demo_df_websockets.settings"
minversion = "6.0"
required_plugins = "pytest-django"
testpaths = ["test_df_websockets", "df_websockets"]
